# Builds the site and deploys it to Cloudflare with Cloudflare's own action
# (https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/), plus a daily run that pulls the
# night's scores from ESPN and commits them before building. The NBA report's workflow (nba-report.yml) also starts it
# after each report it saves, as often as every half hour on game days, since version 4 prices games from that report;
# each of those runs fetches too, and one with no new scores commits nothing.
name: Refresh scores and deploy

on:
  push:
    branches: [main]
  schedule:
    # A backup for the Cloudflare Worker in cron/, which starts this workflow at 08:17 UTC. GitHub can delay or
    # drop scheduled runs, so this run comes four hours later (7:17 AM Eastern in winter, 8:17 AM in summer). A
    # run with no new scores commits nothing.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      fetch: ${{ steps.fetch.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The tests load the History ledger through Vite, so the packages go in before them.
      - run: npm ci
      # The tests run beside the fetch and the build, in a worktree of the commit as pushed, so the fetch's new files
      # never reach them, as when they ran first. They take up to a minute; the deploy waits for them below.
      - name: Start the tests
        run: |
          git worktree add --detach "$RUNNER_TEMP/tests" HEAD
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/tests/node_modules"
          (cd "$RUNNER_TEMP/tests" && npm test > "$RUNNER_TEMP/tests.log" 2>&1; echo $? > "$RUNNER_TEMP/tests.exit") &
      # A failed fetch never holds back the deploy, so an outage at ESPN never holds back a change to the site. The
      # build reads what is on disk: the scores already committed, or a games file the fetch wrote before it failed
      # later, which the commit step skips. The fetch-failed job below then turns the run red.
      - name: Fetch this season's games, box scores, injury report and schedule from ESPN
        id: fetch
        continue-on-error: true
        # A day's fetch takes minutes; ESPN failing with many names to look up could retry for hours and hold every
        # deploy behind it, so a slow run fails here and the injury report is committed alone.
        timeout-minutes: 30
        run: npm run fetch
      - name: Commit new scores
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/games src/data/box src/data/injuries src/data/schedule src/data/players.json src/data/draft.json
          git diff --cached --quiet && exit 0
          git commit -m "Update scores"
          # A run that waited in the queue may be behind a push made since, which would reject its own, and the NBA
          # report's workflow pushes as often as every half hour.
          for attempt in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
      # The fetch saves the injury report before the scores, and the day's first saved report stands, so it is kept
      # even when the scores fail: a retry later in the day would otherwise save that afternoon's in its place.
      - name: Commit the injury report alone
        if: steps.fetch.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/injuries
          git diff --cached --quiet || { git commit -m "Update the injury report" && git pull --rebase --autostash && git push; }
      # Each run keeps finished seasons' team histories for the next (src/lib/ledger.ts, SWISHRANK_CACHE), so a day's
      # build works out only the season in progress. The key changes every run, so each saves a fresh copy, and
      # restore-keys brings back the latest. A history whose code or data has changed since is worked out again.
      - name: Restore finished seasons' team histories
        uses: actions/cache@v4
        with:
          path: .cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-
      - run: npm run build
        env:
          SWISHRANK_CACHE: .cache
      - name: Test the Elo math
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/tests.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/tests.log"
          exit "$(cat "$RUNNER_TEMP/tests.exit")"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  fetch-failed:
    needs: deploy
    if: always() && needs.deploy.outputs.fetch == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The ESPN fetch failed, so the site went out with the scores it already had. The deploy job's fetch step says why."
          exit 1
