# Astro's GitHub Pages workflow (https://docs.astro.build/en/guides/deploy/github/), plus a daily run
# that pulls the night's scores from ESPN and commits them before building.
name: Refresh scores and deploy

on:
  push:
    branches: [main]
  schedule:
    # A backup for the Cloudflare Worker in cron/, which starts this workflow at 08:17 UTC. GitHub can delay or
    # drop scheduled runs, so this run comes four hours later (8:17 AM Eastern in winter, 9:17 AM in summer). A
    # run with no new scores commits nothing.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      fetch: ${{ steps.fetch.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the Elo math
        run: npm test
      # A failed fetch writes nothing, so the site still builds and deploys on the scores already committed, and
      # an outage at ESPN never holds back a change to the site. The fetch-failed job below then turns the run red.
      - name: Fetch this season's games from ESPN
        id: fetch
        continue-on-error: true
        run: npm run fetch
      - name: Commit new scores
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/games
          # A run that waited in the queue may be behind a push made since, which would reject its own.
          git diff --cached --quiet || { git commit -m "Update scores" && git pull --rebase && git push; }
      - name: Install, build, and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  fetch-failed:
    needs: [build, deploy]
    if: always() && needs.build.outputs.fetch == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The ESPN fetch failed, so the site went out with the scores it already had. The build job's fetch step says why."
          exit 1
